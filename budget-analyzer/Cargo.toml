[package]
name = "budget-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["BlaBlaLang Team"]
description = "Universal budget analyzer with semantic detection"

[[bin]]
name = "budget"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
lazy_static = "1.5.0"
cc = "1.0.99"
# Tree-sitter core
tree-sitter = "0.25"

# Tree-sitter languages - THIS IS WHERE YOU ADD NEW LANGUAGES IF YOU WANT TO CONTRIBUTE
tree-sitter-typescript = { version = "0.23", features = [] }
tree-sitter-python = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-blablalang = { path = "../blablalang-tree-sitter" }

# JSON/Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system
walkdir = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

[dev-dependencies]
pretty_assertions = "1.4.1"
